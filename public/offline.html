<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141518" />
    <title>TradeLog - Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        background-color: #141518;
        background-image:
          radial-gradient(ellipse 85% 45% at 50% -8%, rgba(255, 255, 255, 0.085), transparent 68%),
          linear-gradient(180deg, #16171b 0%, #111215 100%);
        color: #ffffff;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 28px 24px;
        border-radius: 24px;
        background: linear-gradient(168deg, rgba(44, 46, 52, 0.76) 0%, rgba(25, 26, 30, 0.84) 100%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.2), 0 20px 48px -12px rgba(0, 0, 0, 0.65);
        text-align: center;
      }
      .logo {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        font-size: 13px;
        line-height: 1.5;
        color: #a3a3a3;
      }
      button {
        appearance: none;
        width: 100%;
        padding: 12px 20px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        background: linear-gradient(180deg, #ffffff 0%, #e5e7eb 100%);
        color: #0b0c0e;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1D1E22" />
            <stop offset="55%" stop-color="#0E0F12" />
            <stop offset="100%" stop-color="#070709" />
          </linearGradient>
          <linearGradient id="rim" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(255,255,255,0.34)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.10)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0.20)" />
          </linearGradient>
        </defs>
        <rect x="1.5" y="1.5" width="37" height="37" rx="10.5" fill="url(#bg)" stroke="url(#rim)" stroke-width="1.2" />
        <path d="M 8 11.5 H 28.5 C 30.8 11.5 32 12.7 32 14.8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 13.5 11.5 V 28.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
        <path d="M 19.5 16 V 25 C 19.5 27.3 21 28.5 23.3 28.5 H 28.5 C 30.8 28.5 32 27.3 32 25 V 20.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 25.5 20.5 H 32" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
      </svg>
      <h1>You&apos;re Currently Offline</h1>
      <p>
        TradeLog requires an internet connection to sync your accounts and trades securely with your cloud journal.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
